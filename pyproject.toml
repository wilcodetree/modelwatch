[project]
name = "modelwatch"
version = "0.1.0a1"
description = "Private longitudinal model benchmark"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "httpx",
    "inspect-ai==0.3.266",
    "openai",
    "pandas",
    "pyyaml",
    "typer",
]

[project.scripts]
modelwatch = "modelwatch.cli:app"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modelwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
