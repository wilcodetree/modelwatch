services:
  default:
    build:
      context: .
      dockerfile_inline: |
        FROM mcr.microsoft.com/powershell:7.4-debian-12
        RUN apt-get update \
            && apt-get install -y --no-install-recommends python3-pytest \
            && rm -rf /var/lib/apt/lists/*
    command: tail -f /dev/null
    working_dir: /workspace
    network_mode: none
    init: true
    stop_grace_period: 1s
